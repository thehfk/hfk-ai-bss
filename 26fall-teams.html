<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust:100%; }
  body { font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
         background:var(--bg); color:var(--ink); margin:0; padding:64px 24px 120px;

  .wrap { max-width:880px; margin:0 auto; }

  header { margin-bottom:56px; }
  h1 { font-size:30px; font-weight:700; margin:0 0 18px; line-height:1.45; }
  .lede { font-size:16px; line-height:1.9; color:var(--sub); margin:0 0 18px; }
  .meta { font-size:14px; line-height:1.8; color:var(--sub); margin:0;
          padding:14px 18px; background:#fff; border:1px solid var(--line); border-radius:10px; }

  .filters { background:#fff; border:1px solid var(--line); border-radius:16px;
             padding:32px 28px; margin-bottom:36px; }
  .frow { margin-bottom:30px; }
  .frow:last-child { margin-bottom:0; }
  .flabel { display:block; font-size:13px; font-weight:700; color:var(--accent);
            margin:0 0 14px; letter-spacing:0.02em; }
  .chipwrap { position:relative; }
  .chips { display:flex; flex-wrap:wrap; gap:10px; }
  /* 화살표·페이드는 가로 스크롤이 되는 모바일에서만 나온다 */
  .edge, .arrow { display:none; }
  button.chip { font:inherit; font-size:14px; line-height:1.4; padding:11px 18px; border-radius:999px;
                border:1px solid var(--line); background:#fff; color:var(--ink); cursor:pointer;
                transition:.15s; -webkit-tap-highlight-color:transparent; }
  button.chip:hover { border-color:var(--accent); color:var(--accent); }
  button.chip.on { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }

  .bar { display:flex; flex-wrap:wrap; gap:16px; align-items:center; justify-content:space-between;
         margin:0 0 28px; padding:0 4px; }
  .count { font-size:15px; font-weight:600; color:var(--ink); }
  .reset { font:inherit; font-size:14px; background:none; border:none; color:var(--accent);
           text-decoration:underline; text-underline-offset:3px; cursor:pointer; padding:8px 0; }

  .cards { display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:22px; }
  a.card { display:flex; flex-direction:column; gap:16px; background:var(--card); border:1px solid var(--line);
           border-radius:14px; padding:30px 28px; text-decoration:none; color:inherit; transition:.15s; }
  a.card:hover { border-color:var(--accent); transform:translateY(-2px); }
  .tags { display:flex; flex-wrap:wrap; gap:8px; }
  .tag { font-size:12px; line-height:1.5; padding:5px 12px; border-radius:999px;
         background:#fff; border:1px solid var(--line); color:var(--sub); }
  .tag.keep { background:var(--accent); border-color:var(--accent); color:#fff; }
  .name { font-size:20px; font-weight:700; margin:0; }
  .one { font-size:15px; line-height:1.8; color:var(--ink); margin:0; }
  .info { font-size:14px; line-height:1.9; color:var(--sub); margin:0;
          padding-top:16px; border-top:1px solid var(--line); }
  .go { font-size:14px; font-weight:600; color:var(--accent); margin:0; }
  .empty { padding:80px 0; text-align:center; color:var(--sub); font-size:16px; line-height:1.8; }
  .foot { margin-top:64px; padding-top:32px; border-top:1px solid var(--line);
          font-size:14px; line-height:2.1; color:var(--sub); }
  .foot a { color:var(--accent); }

  /* 레터 안에 iframe으로 넣을 때: 제목·소개를 빼고 여백을 줄인다 (?embed=1) */
  body.embed { padding:20px 16px 32px; background:transparent; }
  body.embed header { display:none; }
  body.embed .filters { margin-bottom:28px; }
  body.embed .foot { margin-top:40px; }

  @media (max-width:640px) {
    body { padding:36px 18px 80px; }
    header { margin-bottom:40px; }
    h1 { font-size:24px; margin-bottom:14px; }
    .lede { font-size:15px; line-height:1.85; }
    .filters { padding:24px 20px; border-radius:14px; margin-bottom:28px; }
    .frow { margin-bottom:26px; }
    button.chip { font-size:14px; padding:11px 16px; }

    /* 칩이 줄바꿈으로 쌓이면 필터만 화면을 다 먹는다. 한 줄로 눕히고 옆으로 넘긴다 */
    .chips { flex-wrap:nowrap; gap:8px; overflow-x:auto; scroll-behavior:smooth;
             scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch;
             scrollbar-width:none; padding:2px 0; margin:-2px 0; }
    .chips::-webkit-scrollbar { display:none; }
    .chips button.chip { flex:0 0 auto; scroll-snap-align:start; }

    .edge { display:block; position:absolute; top:0; bottom:0; width:56px; pointer-events:none;
            opacity:0; transition:opacity .15s; }
    .edge.on { opacity:1; }
    .edge.left  { left:-2px;  background:linear-gradient(to right, #fff 35%, rgba(255,255,255,0)); }
    .edge.right { right:-2px; background:linear-gradient(to left,  #fff 35%, rgba(255,255,255,0)); }
    .arrow { display:flex; position:absolute; top:50%; transform:translateY(-50%);

             border-radius:50%; border:1px solid var(--line); background:#fff; color:var(--accent);
             font:inherit; font-size:15px; line-height:1; cursor:pointer; opacity:0;
             box-shadow:0 1px 5px rgba(45,37,35,.16); transition:opacity .15s;
             -webkit-tap-highlight-color:transparent; }
    .arrow.on { opacity:1; }
    .arrow.left  { left:-4px; }
    .arrow.right { right:-4px; }
    .cards { grid-template-columns:1fr; gap:18px; }
    a.card { padding:26px 22px; }
    .name { font-size:19px; }
    .foot { margin-top:48px; }

</style>

      <p class="name">${t.name}</p>
      <p class="one">${t.one}</p>
      <p class="info">${t.slot} · 총 ${t.rounds}회<br>첫 세션 ${t.first} · ${t.partner} 파트너</p>
      <p class="go">상세페이지 보기 →</p>
    </a>`).join("");
}

document.querySelectorAll(".frow").forEach(row => {
  const group = row.dataset.group;
  row.querySelectorAll("button.chip").forEach(btn => {
    btn.addEventListener("click", () => {
      row.querySelectorAll("button.chip").forEach(b => b.classList.remove("on"));
      btn.classList.add("on");
      state[group] = btn.dataset.v;
      render();
    });
  });
});

document.getElementById("reset").addEventListener("click", () => {
  Object.keys(state).forEach(k => state[k] = "");
  document.querySelectorAll(".frow").forEach(row => {
    row.querySelectorAll("button.chip").forEach((b, i) => b.classList.toggle("on", i === 0));
  });
  render();
});

// 모바일에서 칩 줄이 옆으로 넘어갈 때, 더 있다는 표시로 화살표와 페이드를 붙인다.
// (데스크톱은 칩이 줄바꿈되어 넘칠 일이 없으므로 CSS에서 숨겨 둔다)
document.querySelectorAll(".chips").forEach(chips => {
  const wrap = document.createElement("div");
  wrap.className = "chipwrap";
  chips.parentNode.insertBefore(wrap, chips);
  wrap.appendChild(chips);

  const make = (cls, tag, txt) => {
    const el = document.createElement(tag);
    el.className = cls;
    if (txt) { el.textContent = txt; el.type = "button"; el.setAttribute("aria-label", txt === "‹" ? "이전 항목" : "다음 항목"); }
    wrap.appendChild(el);
    return el;
  };
  const fadeL = make("edge left", "div");
  const fadeR = make("edge right", "div");
  const arrowL = make("arrow left", "button", "‹");
  const arrowR = make("arrow right", "button", "›");

  const sync = () => {
    const max = chips.scrollWidth - chips.clientWidth;
    const atStart = chips.scrollLeft <= 2;
    const atEnd = chips.scrollLeft >= max - 2;
    const scrollable = max > 4;
    [fadeL, arrowL].forEach(el => el.classList.toggle("on", scrollable && !atStart));
    [fadeR, arrowR].forEach(el => el.classList.toggle("on", scrollable && !atEnd));
  };
  const step = dir => chips.scrollBy({ left: dir * chips.clientWidth * 0.7, behavior: "smooth" });

  arrowL.addEventListener("click", () => step(-1));
  arrowR.addEventListener("click", () => step(1));
  chips.addEventListener("scroll", sync, { passive: true });
  window.addEventListener("resize", sync);
  sync();
});

// 레터 안 iframe에서 열리면(?embed=1) 제목·소개를 접고 여백을 줄인다
if (new URLSearchParams(location.search).get("embed") === "1") {
  document.body.classList.add("embed");
}

render();
</script>

<script>
// ?embed=1 (아임웹 iframe) 이면 바깥 여백·폭 제한을 빼고 높이를 부모에게 알린다.
(function () {
  if (!/[?&]embed=1/.test(location.search)) return;
  document.documentElement.classList.add('hfk-embed');
  var css = document.createElement('style');
  css.textContent = 'html.hfk-embed body{padding-left:0!important;padding-right:0!important;' +
    'padding-top:0!important}html.hfk-embed .wrap,html.hfk-embed .container{max-width:none!important}';
  document.head.appendChild(css);
  var last = 0;
  function tell() {
    var h = Math.ceil(document.documentElement.scrollHeight);
    if (h && Math.abs(h - last) > 1) { last = h; parent.postMessage({ hfkEmbedHeight: h }, '*'); }
  }
  new ResizeObserver(tell).observe(document.body);
  addEventListener('load', tell); addEventListener('resize', tell);
  setInterval(tell, 1000); tell();
})();
</script>
