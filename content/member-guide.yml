# HFK 멤버 가이드 문구 정본.
# 여기만 고치고 `python3 scripts/build_member_guide.py` 를 돌리면
#   ① hfk-presentations/member-guide.html (thehfk.github.io 미리보기)
#   ② work/상시/발행/멤버가이드_아임웹위젯_전문.html (thehfk.org/guide 붙여넣기용)
# 두 벌이 다시 만들어집니다. --copy 를 붙이면 ②가 클립보드에 들어갑니다.
#
# 순서·문구는 뉴멤버 OT 덱(presentation-newmember-orientation.html)과 같이 갑니다.
# 덱을 고치면 여기도 같이 고쳐주세요. 스크린샷은 hfk-presentations/assets/shots/ 에 있습니다.
#
# 디자인 값(글자 크기·자간·여백·색)은 문구가 아니라 scripts/build_member_guide.py 의 TOKENS 에 있습니다.

hero:
  eyebrow: WELCOME TO HFK
  title: HFK 멤버 가이드
  lead: 처음 오신 멤버를 위한 안내입니다. HFK를 소개하고, 시즌 참여 방법을 안내드린 뒤, 멤버들과 자기소개를 나눕니다.

about:
  title: About HFK
  sub: 실무 리더가 더 깊이 성장할 수 있는 질문과 환경을 만드는 커뮤니티입니다.
  cards:
    - label: MISSION
      heading: 실무 리더가 더 깊이 성장할 수 있는 질문과 환경을 만든다
      paras:
        - 일을 하며 반드시 마주하게 되는 깊은 질문을 함께 탐구합니다.
        - 다양한 산업의 실무 리더가 서로의 경험과 관점을 교차시키며 사고의 깊이를 넓혀갑니다.
    - label: VISION
      heading: 실무 리더의 성장을 설계하는 가장 신뢰받는 커뮤니티가 된다
      paras:
        - HFK 라운지인 오아시스 덕수궁으로 다양한 산업의 실무 리더가 모입니다.
        - 질문을 나누고, 관점을 확장하며, 자신의 경험을 기록으로 남기는 플랫폼을 지향합니다.
  history:
    label: HISTORY
    rows:
      - ["2013. 5", "HBR Forum Korea 시작"]
      - ["2016. 6", "HFK 라운지 '오아시스 덕수궁' 오픈"]
      - ["2018. 1", "시즌제 멤버십 도입"]
      - ["2021. 4", "정동401프로젝트 론칭 (마이시크릿덴)"]
      - ["2022. 3", "커뮤니티 동아리 'HFK 클럽' 시작"]
    links:
      - ["Youtube", "https://www.youtube.com/@hfk"]
      - ["Website", "https://thehfk.org"]
      - ["Instagram", "https://www.instagram.com/hfk_official/"]
    links_tail: 에서 HFK의 활동을 만나보실 수 있습니다.

program:
  title: 멤버십 구성
  sub: 팀, 이벤트, 클럽으로 한 시즌이 채워집니다.
  items:
    - kicker: 전공 · 월 2회
      heading: 팀
      text: 3개월간 총 6번 모입니다. 두 번째 달부터 다른 팀에 게스트로 참여해 청강해보는 '팀 어드벤처'를 신청할 수 있습니다.
      photos: [team-1, team-2, team-3, team-4]
      alt: HFK 팀 세션
    - kicker: 교양 · 매주 수요일
      heading: 이벤트
      text: 멤버의 지적 자극을 위해 매 달 다른 세미나가 진행됩니다. AAR 밋업, HBR·PEST 브리핑, 저자 북토크, 스페셜 토크가 준비됩니다.
      photos: [event-1, event-2, event-3, event-4]
      alt: HFK 이벤트
    - kicker: 동아리 · 월 N회
      heading: 클럽
      text: 멤버가 직접 기획하고 운영하는 비공식 모임입니다. 매월 1회 이상 자유롭게 열립니다.
      photos: [club-1, club-2, club-3, club-4]
      alt: HFK 클럽

steps:
  title: 시작하기 전 열 가지
  sub: 슬랙 익히기(가입과 프로필 · 채널 구성 · 시즌 레터) · 슬랙에서 참석 신청하기(이벤트 · 팀 어드벤처) · 모임 참석하기(자기소개 미션 · 그라운드룰 · 4L 리뷰) · 모임 활동하기(멤버 베네핏 · 카카오톡 오픈채팅방). 아래 순서대로 안내드립니다.
  items:
    - title: 슬랙 가입과 프로필
      lead: HFK의 모든 소통은 슬랙에서 이뤄집니다. 시즌 첫 공지 전날 문자로 초대 링크를 보내드리니, 받으시면 바로 가입해 주세요. 가입 후 본인 사진을 클릭해 View Profile로 들어가, 프로필을 아래처럼 맞춰주시면 서로를 알아보기 쉽습니다.
      label: 프로필 설정 (모바일 · 웹브라우저)
      kv:
        - ["Display Name", "이름_팀명"]
        - ["What I do", "회사명"]
      shots:
        - ["shot-profile.jpg", "슬랙", "프로필은 이렇게 맞춰주세요. Display Name 은 '이름_팀명' 입니다", "슬랙 프로필 설정 화면"]

    - title: 슬랙 채널 익히기
      lead: 채널은 앞자리 번호로 성격을 구분합니다. 번호만 보면 어떤 채널인지 바로 알 수 있어요.
      kv_accent: true
      kv:
        - ["0", "전체 멤버 대상. 공지 확인, 교류 게시판이 모여 있습니다."]
        - ["1", "진행 중인 시즌의 멤버만. 시즌 공지, 어드벤처 신청, 자신이 신청한 팀 채널이 있습니다."]
        - ["2", "이벤트 관련. AAR 밋업, HBR·PEST 브리핑, 저자 북토크, 스페셜 토크 안내가 올라옵니다."]
        - ["3", "클럽. 멤버가 만드는 동아리 활동이 모이는 채널입니다."]
      channels:
        - group: 0 · 전체 멤버
          list: ["# 0--공지-확인", "# 0--교류-게시판"]
        - group: 1 · 이번 시즌 멤버
          list: ["# 1--26가을-공지-확인", "# 1--26가을-어드벤처-신청", "# 1--마케팅디깅", "# 1--리더의서재", "# 1--강점차별화"]
        - group: 2 · 이벤트
          list: ["# 2--저자북토크", "# 2--pest브리핑", "# 2--aar밋업", "# 2--hbr포럼", "# 2--스페셜토크"]
        - group: 3 · 클럽
          list: ["# 3--a-와인소사이어티", "# 3--2-필사클럽", "# 3--e-벽돌책완독클럽", "# 3--n-바이브마케터클럽"]
      note: 1번은 이번 시즌 멤버만 들어옵니다. 팀 채널은 신청한 팀만 보이니, 위 팀 이름은 예시로 봐주세요. 클럽은 신청한 분만 초대됩니다.
      shots:
        - ["shot-channels.jpg", "슬랙", "채널 목록. 앞자리 번호가 0 전체 · 1 시즌 · 2 이벤트 · 3 클럽 을 뜻합니다", "슬랙 채널 목록"]

    - title: 회차 공지와 시즌 레터
      blocks:
        - label: 회차 공지 읽는 법
          text: 매 회차 전, 1번 채널에 공지가 올라옵니다. 일시와 장소, 주차 안내, 준비물, 참석 여부 체크가 담겨 있어요. <b>공지를 읽고 참석 여부는 이모지로 꼭 표시해 주세요.</b>
        - label: 시즌 레터
          text: 시즌 동안 레터를 보내드립니다. 팀과 이벤트 소식, 멤버들이 남긴 기록이 담깁니다. <b>매주 정해진 요일 밤 9시</b>, 슬랙과 웹사이트 두 곳에 항상 함께 올라옵니다.
      shots:
        - ["shot-notice-emoji.jpg", "슬랙", "회차 공지. 읽으신 뒤 참석 여부를 이모지로 꼭 표시해 주세요", "슬랙 회차 공지와 참석 이모지"]
        - ["shot-letter-notice.jpg", "슬랙", "시즌 레터가 나오면 공지 채널에 이렇게 올라옵니다", "슬랙 시즌 레터 공지"]
        - ["shot-letter-page.jpg", "웹사이트", "레터 전문은 HFK 노트 게시판에서 언제든 다시 보실 수 있습니다", "웹사이트 HFK 노트의 시즌 레터"]
        - ["shot-letter-content.jpg", "레터 본문", "슬랙과 카톡방 안내, 멤버 가이드가 레터 안에 담깁니다", "시즌 레터 본문 중 채널 안내"]

    - title: 이벤트 신청
      lead: 이벤트는 수요일 저녁에 열립니다. 저자 북토크, PEST 브리핑, AAR 밋업, HBR 포럼, 스페셜 토크가 2번 채널에 각각 있습니다.
      blocks:
        - label: 신청 방법
          text: 가고 싶은 이벤트 채널에 공지가 올라옵니다. 공지의 <b>신청 링크</b>를 눌러 폼에서 참여할 이벤트를 고르고, 기대되거나 궁금한 점을 적어 신청하시면 됩니다.
        - label: 확정 안내
          text: 신청 마감 후 확정·대기 명단을 댓글로 알려드립니다. 이번 시즌 멤버와 ODC 멤버는 무료로 신청할 수 있습니다.
      shots:
        - ["shot-ot-notice.jpg", "슬랙", "이벤트 공지. 일시·장소·신청 기간을 확인하고 신청 링크를 누릅니다", "슬랙 이벤트 공지"]
        - ["shot-eventform.jpg", "신청 폼", "참여할 이벤트를 고르고, 기대되거나 궁금한 점을 적어 신청합니다", "이벤트 신청 폼"]
        - ["shot-letter-event.jpg", "레터 본문", "이번 시즌 이벤트 일정은 레터에서도 한눈에 보실 수 있습니다", "시즌 레터 본문 중 주요 이벤트 안내"]

    - title: 팀 어드벤처
      lead: 자신의 팀 외에 다른 팀 세션을 한 번씩 청강해볼 수 있습니다. 시즌 두 번째 달부터 신청할 수 있어요.
      blocks:
        - label: 신청 방법
          text: 1번 <b>어드벤처 신청</b> 채널에 참여 가능한 세션 일정이 올라옵니다. 채널명을 눌러 가고 싶은 팀 채널로 이동한 뒤, 그 회차 공지에 '어드벤처 신청합니다' 댓글을 남기시면 됩니다.
        - label: 참석 확정
          text: 확정되면 ✅ 이모지로 알려드립니다. 팀 인원을 포함해 15명이 넘으면 어려울 수 있습니다.
      shots:
        - ["shot-adventure-notice.jpg", "슬랙", "어드벤처 채널. 청강 가능한 다른 팀 세션 일정이 올라옵니다", "슬랙 팀 어드벤처 공지"]
        - ["shot-adventure-comment.jpg", "슬랙", "가고 싶은 팀의 회차 공지에 댓글로 신청하면, 확정 명단이 댓글로 올라옵니다", "슬랙 어드벤처 신청 댓글과 참석 확정 안내"]

    - title: 자기소개 미션
      lead: 첫 모임 전, 1번 팀 채널에 자기소개를 댓글로 남겨주세요. 어떤 일을 하고 계신지, HFK를 알게 된 경로, 이번 시즌에 이루고 싶은 목표를 적어주시면 됩니다.
      note: 개인정보 보호를 위해 자기소개 글은 3개월 후 자동으로 삭제됩니다.
      shots:
        - ["shot-selfintro.jpg", "슬랙", "첫 모임 전, 팀 채널 자기소개 공지에 댓글을 남겨주세요", "슬랙 자기소개 댓글"]

    - title: 그라운드룰
      lead: 서로를 존중하며 오래 함께하기 위한 약속입니다.
      rules:
        - [호칭, "직급, 나이를 떠나 서로 '님'으로 부릅니다."]
        - [명칭, "수업, 클래스 대신 '팀', '세션'이라고 합니다."]
        - [존중, "다른 생각은 사고의 폭을 넓혀줍니다. 서로의 의견과 취향을 존중합니다."]
        - [비밀, "Off the record. 이곳에서 들은 이야기는 이곳에 둡니다."]
        - [환대, "먼저 반갑게 인사를 건넵니다."]
        - [과제, "성장하기 위해 모인 만큼 과제를 충실히 합니다."]
        - [기록, "모임에서 배운 것을 4L로 정리합니다. (Liked, Learned, Lacked, Long for)"]

    - title: 4L 리뷰 (모임 후 필수)
      lead: 배움이 휘발되지 않도록, 모임이 끝나기 전 슬랙에 4L 리뷰를 꼭 남겨주세요. 기록할 때 비로소 자신의 것이 됩니다.
      kv:
        - [Liked, "오늘 좋았던 점"]
        - [Learned, "내게 영감을 준 내용"]
        - [Lacked, "앞으로 발전시키고 싶은 부분"]
        - ["Long for", "오늘을 바탕으로 시도해보고 싶은 것"]

    - title: 멤버 베네핏
      lead: 시즌에 등록한 멤버라면 누구나 누릴 수 있습니다.
      benefits:
        - num: "01"
          heading: 하버드 비즈니스<br>리뷰 최신호
          img: https://cdn.imweb.me/upload/S20240629fee25a0bc999e/4a058c9e78d51.png
          alt: 하버드 비즈니스 리뷰
          text: 첫 세션에 HBR 최신호 1권을 드립니다. (정가 2.5만원)
        - num: "02"
          heading: 마이시크릿덴<br>· 소정동
          img: https://cdn.imweb.me/upload/S20240629fee25a0bc999e/fdeabe924dbc2.png
          alt: 마이시크릿덴 · 소정동
          text: 마이시크릿덴 낮(공유서재) 이용권 1회 무료, 밤(와인) 글래스 50%·바틀 10% 할인, 소정동(원테이블 라운지) 공간비 1회 50% 할인.
        - num: "03"
          heading: 폴인(fol:in)<br>Lite 3개월
          img: https://cdn.imweb.me/upload/S20240629fee25a0bc999e/886c0c55ab875.png
          alt: 폴인
          text: 일하는 나를 위한 인사이트 콘텐츠 서비스 폴인의 Lite 이용권을 3개월간 무료로 드립니다. 쿠폰번호는 슬랙에 공지합니다.
        - num: "04"
          heading: 재등록 할인과<br>클럽 참여
          img: PHOTO/club-1.jpg
          alt: HFK 클럽
          text: 다음 시즌에 개인 비용으로 재등록하시면 20만원을 할인해 드립니다. 멤버끼리 만드는 관심사 모임인 클럽에도 참여하실 수 있습니다.

    - title: 카카오톡 · 오픈채팅방
      lead: 슬랙과 함께 카카오톡도 씁니다. 공지방과 오픈채팅방 두 개가 있어요.
      blocks:
        - label: 공지 카톡방
          text: 슬랙에 올라온 시즌 공지를 카톡으로도 받아보실 수 있습니다. 놓치기 쉬운 안내를 한 번 더 짚어드립니다.
        - label: 오픈채팅방
          text: 매일 아침 재윤님이 롱블랙 아티클을 보냅니다. 멤버들이 뉴스 클리핑을 나누고 가볍게 교류하는 곳이에요. 참여는 공지에 걸린 링크로 하시면 됩니다.
      shots:
        - ["shot-kakao.jpg", "카카오톡", "왼쪽이 시즌 공지방, 오른쪽이 오픈채팅방입니다", "카카오톡 공지방과 오픈채팅방"]

closing:
  eyebrow: YOUR GROWTH MATTERS
  title: HFK에 오신 것을 환영합니다
  text: 궁금한 점은 언제든 HFK 슬랙과 채널톡으로 물어봐 주세요.
