<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>오픈 알람 신청</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  html,body{margin:0;padding:0;background:#f0eae2;}
  body{padding:48px 20px 64px;font-family:'Pretendard',-apple-system,BlinkMacSystemFont,sans-serif;
        letter-spacing:-0.02em;word-break:keep-all;}
  /* iframe 으로 실릴 때는 폭·여백을 아임웹 섹션이 정한다 */
  html.hfk-embed body{padding:0;}
  /* 위젯 카드의 둥근 모서리 뒤로 iframe 배경(크림)이 비쳐 아임웹의 어두운 칸에서
     모서리에 밝은 조각이 생긴다. 실릴 때는 맨 바깥 카드만 각지게 해 꽉 채운다. */
  html.hfk-embed body > div{border-radius:0 !important;}
</style>
</head>
<body>
<!-- 자동 생성물입니다. 고치지 마세요. 원본: content/widgets/season-alarm.html · 만든이: scripts/build_widgets.py -->
<!-- ============================================================
     HFK 다음 시즌 오픈 알람 신청 폼
     사용법:
     1) 아래 SCRIPT_URL 을 본인 구글 앱스 스크립트 웹앱 URL로 교체
     2) 아임웹 페이지에 [코드/HTML 위젯]으로 이 전체를 붙여넣기
        (일반 텍스트 편집기에 넣으면 <script>가 지워질 수 있어요)
     ============================================================ -->
<div id="hfk-alarm">
  <div class="hfk-card">
    <h2 class="hfk-title">다음 시즌 오픈 알람 신청</h2>
    <p class="hfk-intro">
      HFK는 매 시즌 멤버들의 니즈를 반영해 새로운 팀을 준비합니다.<br>
      다음 시즌에 진행될 팀이 궁금하시다면 오픈 알람을 신청해 주세요.<br>
      입력하신 연락처로 오픈일에 문자와 메일을 보내드립니다.
    </p>

    <a class="hfk-secondary" href="https://thehfk.org/archive" target="_blank" rel="noopener">지난 시즌 팀 보기</a>

    <form id="hfk-alarm-form" autocomplete="on">
      <label class="hfk-label">이름 <span class="hfk-req">*</span></label>
      <input class="hfk-input" name="name" type="text" required placeholder="이름을 입력해 주세요">

      <label class="hfk-label">휴대폰 번호 <span class="hfk-req">*</span></label>
      <input class="hfk-input" name="phone" type="tel" required inputmode="numeric" placeholder="010-0000-0000">

      <label class="hfk-label">이메일 <span class="hfk-req">*</span></label>
      <input class="hfk-input" name="email" type="email" required placeholder="name@example.com">

      <label class="hfk-label">궁금한 팀 · 건의사항</label>
      <textarea class="hfk-input" name="suggestion" rows="4" placeholder="다음 시즌에 이런 팀이 있으면 좋겠어요 (선택)"></textarea>

      <label class="hfk-consent">
        <input type="checkbox" name="consent" required>
        <span>개인정보(이름·연락처·이메일) 수집 및 이용에 동의합니다. 수집한 정보는 오픈 알림 발송 목적으로만 사용합니다.</span>
      </label>

      <button class="hfk-submit" type="submit">오픈 알람 신청하기</button>
    </form>

    <div id="hfk-alarm-done" class="hfk-done">
      신청이 완료되었습니다.<br>오픈일에 문자와 메일로 알려드릴게요. 감사합니다.
    </div>
  </div>
</div>

<style>
  #hfk-alarm { box-sizing:border-box; }
  #hfk-alarm *, #hfk-alarm *::before, #hfk-alarm *::after { box-sizing:border-box; }
  #hfk-alarm { display:flex; justify-content:center; padding:24px 16px;
    font-family:'Pretendard','Apple SD Gothic Neo',system-ui,-apple-system,sans-serif; color:#222; }
  #hfk-alarm .hfk-card { width:100%; max-width:480px; }
  #hfk-alarm .hfk-title { font-size:22px; font-weight:700; margin:0 0 14px; letter-spacing:-0.02em; }
  #hfk-alarm .hfk-intro { font-size:15px; line-height:1.7; color:#555; margin:0 0 20px; }
  #hfk-alarm .hfk-secondary { display:inline-block; margin:0 0 28px; padding:9px 20px; font-size:14px;
    font-weight:600; color:#441a15; background:#f0eae2; border:1px solid #ceb9a4; border-radius:999px;
    text-decoration:none; transition:background .15s,color .15s; }
  #hfk-alarm .hfk-secondary:hover { background:#ceb9a4; color:#441a15; }
  #hfk-alarm .hfk-label { display:block; font-size:14px; font-weight:600; margin:18px 0 7px; }
  #hfk-alarm .hfk-req { color:#980000; }
  #hfk-alarm .hfk-input { width:100%; padding:13px 14px; font-size:15px; line-height:1.4;
    border:1px solid #d9d9d9; border-radius:8px; background:#fff; color:#222; outline:none;
    transition:border-color .15s; font-family:inherit; }
  #hfk-alarm textarea.hfk-input { resize:vertical; min-height:96px; }
  #hfk-alarm .hfk-input::placeholder { color:#aaa; }
  #hfk-alarm .hfk-input:focus { border-color:#980000; }
  #hfk-alarm .hfk-consent { display:flex; align-items:flex-start; gap:9px; margin:22px 0 6px;
    font-size:13px; line-height:1.6; color:#666; cursor:pointer; }
  #hfk-alarm .hfk-consent input { margin-top:2px; width:16px; height:16px; accent-color:#980000; flex:0 0 auto; }
  #hfk-alarm .hfk-submit { width:100%; margin-top:22px; padding:15px; font-size:16px; font-weight:600;
    color:#f0eae2; background:#980000; border:1px solid #980000; border-radius:999px; cursor:pointer;
    transition:background .15s,border-color .15s; font-family:inherit; }
  #hfk-alarm .hfk-submit:hover { background:#441a15; border-color:#441a15; }
  #hfk-alarm .hfk-submit:disabled { background:#c99; border-color:#c99; cursor:default; }
  #hfk-alarm .hfk-done { display:none; padding:28px 4px; font-size:15px; line-height:1.7; color:#333; text-align:left; }
</style>

<script>
  (function () {
    // ▼▼▼ 여기에 앱스 스크립트 웹앱 URL을 붙여넣으세요 ▼▼▼
    var SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzKxg2IgCL8uE0oUPGoiczcqZwV2mzkgZRiZFxEgjQKfirKB1Q_EgjKFuy4aWVJDnTf/exec';
    // ▲▲▲

    var form = document.getElementById('hfk-alarm-form');
    var done = document.getElementById('hfk-alarm-done');
    var btn  = form.querySelector('.hfk-submit');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      if (!form.consent.checked) { alert('개인정보 수집 및 이용에 동의해 주세요.'); return; }
      btn.disabled = true;
      btn.textContent = '신청 중...';

      fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: new FormData(form) })
        .then(function () {
          form.style.display = 'none';
          done.style.display = 'block';
        })
        .catch(function () {
          btn.disabled = false;
          btn.textContent = '오픈 알람 신청하기';
          alert('전송에 실패했어요. 잠시 후 다시 시도해 주세요.');
        });
    });
  })();
</script>
<script>
(function () {
  if (!/[?&]embed=1/.test(location.search)) return;
  document.documentElement.classList.add('hfk-embed');
  var last = 0;
  function tell() {
    var r = document.body.getBoundingClientRect(), cs = getComputedStyle(document.body);
    var h = Math.ceil(r.height + (parseFloat(cs.marginTop) || 0) + (parseFloat(cs.marginBottom) || 0));
    if (h && Math.abs(h - last) > 1) { last = h; parent.postMessage({ hfkEmbedHeight: h }, '*'); }
  }
  new ResizeObserver(tell).observe(document.body);
  addEventListener('load', tell); addEventListener('resize', tell);
  setInterval(tell, 1000); tell();
})();
</script>
</body>
</html>
